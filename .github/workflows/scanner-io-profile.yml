name: Scanner I/O Profile (diagnostic)

run-name: "Scanner I/O profile ${{ inputs.preset }} | ${{ inputs.backings }}${{ inputs.logical_gb && format(' | {0} GiB', inputs.logical_gb) || '' }}"

# Cold scans of gdu, dua-cli, SpaceKnife and WinDirStat (default, 1, 4 and 8 scanning threads) with the benchmark
# volume's queue depth, reads/s, read latency and size, the VHDX host drive and the CPU sampled every second
# (scripts/profile/scanner_io_profile.py), plus a random-read sweep at 1 / 4 / 16 / 64 reads in flight (hw-probe).
#
# On the benchmark's dynamic VHDX every read reaches the host drive in ~0.1 ms, but scanners keeping many reads in
# flight queue up inside the virtual-disk layer (gdu ~1 ms, SpaceKnife 3-9 ms per read) while WinDirStat's shallow queue
# does not, so it won cold scans on the CI disks and loses on a local NVMe drive. The same tree is profiled on three
# backings to find one without that bias:
#   vhdx    - the benchmark's dynamic VHDX, remounted before each cold scan (the control)
#   folder  - a folder on the runner's physical data drive, OS-wide standby-list purge before each cold scan
#   ramdisk - an NTFS RAM disk (ImDisk; x64 only): no storage latency and no IOPS cap, CPU and filesystem cost alone.
#             The tree is generated with --no-prealloc: files of 256 KiB and more stay sparse, so the ~110 GiB tree
#             takes ~6 GiB of RAM (small files, $MFT and directory indexes) with the same names and layout
# A physical drive or RAM disk cannot hold a preset's preallocated size (low: ~500 GB), so with logical_gb set the tree
# keeps the preset's file count and seed and only its total size shrinks; every backing then gets the same tree.
# configs picks configurations, among them thread-count variants of gdu / dua-cli / SpaceKnife (fewer reads in flight);
# replicas runs that many identical jobs in parallel on separate runners, each in its own shuffled order.
on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Scale preset (its file count is used)"
        required: true
        default: "low"
        type: choice
        options:
          - very-lite
          - lite
          - low
          - mid
      logical_gb:
        description: "Total logical size in GiB of the tree (empty = the preset's own; folder / ramdisk need it small)"
        required: false
        default: "4"
        type: string
      backings:
        description: 'JSON list of volume backings: "vhdx", "folder", "ramdisk"'
        required: true
        default: '["vhdx","folder","ramdisk"]'
        type: string
      rounds:
        description: "Rounds over all configurations (every second round in reverse order; shuffled with replicas)"
        required: true
        default: "2"
        type: string
      configs:
        description: 'Comma-separated configuration labels (empty = gdu, dua-cli, SpaceKnife, 4 WinDirStat ones); thread variants e.g. "gdu 1 core", "dua-cli 2 threads", "SpaceKnife 4 threads"'
        required: false
        default: ""
        type: string
      replicas:
        description: 'JSON list of replica ids: identical parallel jobs on separate runners, each in its own shuffled order (e.g. ["1","2","3"])'
        required: false
        default: '["1"]'
        type: string
      targets:
        description: 'JSON list of targets: "windows-x86_64", "windows-arm64"'
        required: false
        default: '["windows-x86_64","windows-arm64"]'
        type: string

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  profile:
    name: "I/O profile ${{ matrix.target }} | ${{ matrix.backing }} | ${{ inputs.preset }} | r${{ matrix.replica }}"
    runs-on: ${{ matrix.target == 'windows-arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
        backing: ${{ fromJSON(inputs.backings) }}
        replica: ${{ fromJSON(inputs.replicas) }}
        exclude:
          - target: windows-arm64
            backing: ramdisk  # ImDisk has no ARM64 driver
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.target == 'windows-arm64' && 'arm64' || 'x64' }}

      - name: Cache Cargo Registry & Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Build fs-mirage & hw-probe
        shell: bash
        run: cargo build --release -p fs-mirage -p hw-probe

      - name: Cache Pinned Scanner Binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: scanners-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wrappers/scanners_registry.json') }}

      - name: Install Pinned Target Scanners And psutil
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ./scripts/wrappers/run_cli_scanners.py --install-only --bin-dir ./bin
          python -m pip install --quiet psutil || echo "psutil unavailable: process threads and CPU are left out"

      - name: Tree Size
        shell: bash
        run: |
          if [ -n "${{ inputs.logical_gb }}" ]; then
            FILES=$(python -c "import sys; sys.path.insert(0, 'scripts/disk-mgr'); import vdisk_capacity as v; print(v.PRESET_FILES['${{ inputs.preset }}'])")
            GEN="--preset custom --files $FILES --logical-gb ${{ inputs.logical_gb }} --max-physical-mb 500"
            CAP=$(python ./scripts/disk-mgr/vdisk_capacity.py --preset custom --logical-gb "${{ inputs.logical_gb }}" --files "$FILES" --min-gb 60)
          else
            GEN="--preset ${{ inputs.preset }} --max-physical-mb 1500"
            CAP=$(python ./scripts/disk-mgr/vdisk_capacity.py --preset "${{ inputs.preset }}" --min-gb 60)
          fi
          # logical_gb only shrinks the media zone: the other zones of 1M files still add up to ~106 GiB, so size the
          # VHDX from the planned tree itself (a dynamic VHDX only grows with what is written)
          APPARENT=$(./target/release/fs-mirage --root "$RUNNER_TEMP/plan" --seed 42 $GEN --plan-only | sed -n 's/.*apparent_gib=\([0-9.]*\).*/\1/p')
          CAP=$(python -c "import math; print(max($CAP, math.ceil(float('${APPARENT:-0}') * 1.15) + 20))")
          echo "GEN_ARGS=$GEN" >> "$GITHUB_ENV"
          echo "VDISK_GB=$CAP" >> "$GITHUB_ENV"
          echo "fs-mirage $GEN | planned tree ${APPARENT:-?} GiB | VHDX capacity $CAP GiB"

      - name: Prepare The Volume (${{ matrix.backing }})
        shell: pwsh
        run: |
          switch ("${{ matrix.backing }}") {
            "vhdx" {
              ./scripts/disk-mgr/windows_vhd.ps1 create "$env:VDISK_GB" "X:/bench" ntfs
              $root = "X:/bench"; $purge = "vdisk"
            }
            "folder" {
              # the drive that holds the runner's work and temp folders: a physical (Azure temporary) disk
              $drive = $env:RUNNER_TEMP.Substring(0, 2)
              $root = "$drive/bench"; $purge = "system"
              New-Item -ItemType Directory -Force -Path $root | Out-Null
            }
            "ramdisk" {
              choco install imdisk-toolkit -y --no-progress | Out-Null
              if (-not (Get-Command imdisk -ErrorAction SilentlyContinue)) { choco install imdisk -y --no-progress | Out-Null }
              $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + $env:Path
              imdisk -a -s 12G -m R: -p "/fs:ntfs /q /y"
              $root = "R:/bench"; $purge = "system"
              New-Item -ItemType Directory -Force -Path $root | Out-Null
            }
          }
          # same Defender state as the benchmark volume: real-time scanning off, the tree excluded
          Set-MpPreference -DisableRealtimeMonitoring $true -DisableIOAVProtection $true -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $root.Replace("/", "\") -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "fs-mirage.exe", "hw-probe.exe", "python.exe" -ErrorAction SilentlyContinue
          "ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PURGE=$purge" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Get-Volume | Where-Object DriveLetter | Format-Table DriveLetter, FileSystem, DriveType, Size, SizeRemaining -AutoSize | Out-String | Write-Host

      - name: Materialize The Tree (fs-mirage)
        shell: bash
        run: |
          mkdir -p out
          NO_PREALLOC=""
          if [ "${{ matrix.backing }}" = "ramdisk" ]; then NO_PREALLOC="--no-prealloc"; fi
          ./target/release/fs-mirage --root "$ROOT" --seed 42 --manifest-out out/ground_truth.json $GEN_ARGS $NO_PREALLOC
          df -h "$ROOT" 2>/dev/null || true

      - name: Random-Read Sweep (1 / 4 / 16 / 64 reads in flight)
        shell: bash
        run: |
          {
            echo "### ${{ matrix.target }} | ${{ matrix.backing }}: random 4 KiB reads"
            echo
            echo "| reads in flight | reads/s |"
            echo "| ---: | ---: |"
          } > out/rand_sweep.md
          for t in 1 4 16 64; do
            ./target/release/hw-probe --root "$ROOT" --only-rand --rand-threads "$t" --rand-mb 512 --rand-secs 5 --out "out/rand_$t.json" > /dev/null
            iops=$(python -c "import json; print(round(json.load(open('out/rand_$t.json'))['b_rand_read_iops']))")
            echo "| $t | $iops |" >> out/rand_sweep.md
          done
          cat out/rand_sweep.md

      - name: Cold Scans With Per-Second I/O Sampling
        shell: bash
        env:
          CONFIGS: ${{ inputs.configs }}
        run: |
          EXTRA=()
          if [ -n "$CONFIGS" ]; then EXTRA+=(--configs "$CONFIGS"); fi
          # one replica keeps the forward / reverse alternation; several each shuffle with their own seed
          if [ "${{ inputs.replicas }}" != '["1"]' ]; then EXTRA+=(--shuffle-seed "${{ matrix.replica }}"); fi
          python ./scripts/profile/scanner_io_profile.py --path "$ROOT" --purge "$PURGE" --bin-dir ./bin \
            --rounds "${{ inputs.rounds }}" --md-out out/io_profile.md --json-out out/io_profile.json "${EXTRA[@]}"
          {
            echo "## ${{ matrix.target }} | ${{ matrix.backing }} | replica ${{ matrix.replica }} (${{ inputs.preset }}, $GEN_ARGS)"
            echo
            cat out/rand_sweep.md
            echo
            cat out/io_profile.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Teardown
        if: always()
        shell: bash
        run: |
          if [ "${{ matrix.backing }}" = "vhdx" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 teardown "X:/bench" || true
          elif [ "${{ matrix.backing }}" = "ramdisk" ]; then
            imdisk -D -m R: || true
          fi

      - name: Upload Profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: io-profile-${{ matrix.target }}-${{ matrix.backing }}-${{ inputs.preset }}-r${{ matrix.replica }}
          path: out/
          retention-days: 14
