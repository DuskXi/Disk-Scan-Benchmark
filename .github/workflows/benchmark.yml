name: Cross-Platform Disk Scanner Benchmark

run-name: >-
  Bench ${{ inputs.preset }} | ${{
  inputs.preset == 'very-lite' && '100k files / 100GB' ||
  inputs.preset == 'lite' && '400k files / 350GB' ||
  inputs.preset == 'low' && '1M files / 500GB' ||
  inputs.preset == 'mid' && '3M files / 1TB' ||
  inputs.preset == 'high' && '5M files / 2TB' ||
  inputs.preset == 'very-high' && '9M files / 3TB' ||
  format('{0} files / {1}GB', inputs.files, inputs.logical_gb) }} | ${{ substr(github.sha, 0, 7) }}

on:
  # Triggered exclusively via manual workflow_dispatch (no schedule / cron)
  workflow_dispatch:
    inputs:
      preset:
        description: "Scale preset tier (very-lite: 100k/100GB, lite: 400k/350GB, low: 1M/500GB, mid: 3M/1TB, high: 5M/2TB, very-high: 9M/3TB, custom)"
        required: true
        default: "very-lite"
        type: choice
        options:
          - very-lite
          - lite
          - low
          - mid
          - high
          - very-high
          - custom
      files:
        description: "Custom total file items (used only when preset == 'custom')"
        required: false
        default: ""
        type: string
      logical_gb:
        description: "Custom target logical volume in GiB (used only when preset == 'custom')"
        required: false
        default: ""
        type: string
      disk_size_gb:
        description: "Virtual disk image capacity in GiB (default: 60)"
        required: true
        default: "60"
        type: string
      max_physical_mb:
        description: "Maximum physical dirty-extent allocation in MiB (default: 1500)"
        required: true
        default: "1500"
        type: string
      seed:
        description: "Deterministic PRNG seed (ChaCha8Rng)"
        required: true
        default: "42"
        type: string
      enable_ramdisk:
        description: "Enable /dev/shm RAMDisk PCIe 5.0 simulation pass on Linux"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  benchmark:
    name: "Bench (${{ matrix.target_label }} | ${{ inputs.preset }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 & ARM64
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            target_label: linux-x86_64
            mount_path: /mnt/bench
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            target_label: linux-arm64
            mount_path: /mnt/bench

          # macOS x86_64 (Intel) & ARM64 (Apple Silicon)
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            target_label: macos-x86_64
            mount_path: /tmp/BenchVol
          - os: macos-15
            platform: macos
            arch: aarch64
            target_label: macos-arm64
            mount_path: /tmp/BenchVol

          # Windows x86_64 (mount_path uses subfolder X:/bench so drive-root MFT auto-bypass is disabled)
          - os: windows-latest
            platform: windows
            arch: x86_64
            target_label: windows-x86_64
            mount_path: "X:/bench"

          # TODO (Windows ARM64):
          # Once GitHub Actions public windows-11-arm runners support elevated VHDX loop mounting
          # and native ARM64 builds for WizTree / SpaceSniffer / WinDirStat are published, uncomment:
          # - os: windows-11-arm
          #   platform: windows
          #   arch: aarch64
          #   target_label: windows-arm64
          #   mount_path: "X:/"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Core Engines (fs-mirage & hw-probe)
        shell: bash
        run: |
          cargo build --release --workspace

      - name: Install Pinned Target Scanners (Same-Runner Provisioning)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ./scripts/wrappers/run_cli_scanners.py --install-only --bin-dir ./bin

      - name: Create & Mount Virtual Disk Container (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/disk-mgr/*.sh
          case "${{ inputs.preset }}" in
            very-lite) INODES=2000000 ;;
            lite)      INODES=2000000 ;;
            low)       INODES=3000000 ;;
            mid)       INODES=6000000 ;;
            high)      INODES=9000000 ;;
            very-high) INODES=15000000 ;;
            *)         INODES=4000000 ;;
          esac
          if [ "${{ matrix.platform }}" = "linux" ]; then
            ./scripts/disk-mgr/linux_loop.sh create "${{ inputs.disk_size_gb }}" "${{ matrix.mount_path }}" --inodes "$INODES"
          else
            ./scripts/disk-mgr/macos_dmg.sh create "${{ inputs.disk_size_gb }}" "${{ matrix.mount_path }}"
          fi

      - name: Create & Mount Dynamic NTFS VHDX at X:\ (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/disk-mgr/windows_vhd.ps1 create "${{ inputs.disk_size_gb }}" "${{ matrix.mount_path }}"

      - name: Materialize Deterministic Synthetic Filesystem (fs-mirage)
        shell: bash
        run: |
          mkdir -p results/${{ matrix.target_label }}
          EXTRA_ARGS=()
          if [ "${{ inputs.preset }}" = "custom" ]; then
            if [ -n "${{ inputs.files }}" ]; then
              EXTRA_ARGS+=(--files "${{ inputs.files }}")
            fi
            if [ -n "${{ inputs.logical_gb }}" ]; then
              EXTRA_ARGS+=(--logical-gb "${{ inputs.logical_gb }}")
            fi
          fi
          ./target/release/fs-mirage \
            --root "${{ matrix.mount_path }}" \
            --preset "${{ inputs.preset }}" \
            --seed "${{ inputs.seed }}" \
            --max-physical-mb "${{ inputs.max_physical_mb }}" \
            --manifest-out "results/${{ matrix.target_label }}/ground_truth.json" \
            "${EXTRA_ARGS[@]}"

      - name: Measure Hardware Ceiling Baseline (hw-probe)
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            ./scripts/disk-mgr/linux_loop.sh purge-cache "${{ matrix.mount_path }}"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            ./scripts/disk-mgr/macos_dmg.sh purge-cache "${{ matrix.mount_path }}"
          else
            powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 purge-cache "${{ matrix.mount_path }}"
          fi

          ./target/release/hw-probe \
            --root "${{ matrix.mount_path }}" \
            --out "results/${{ matrix.target_label }}/baseline.json"

      - name: Run All Platform Scanners Sequentially on Same Instance
        shell: bash
        run: |
          python ./scripts/wrappers/run_cli_scanners.py \
            --path "${{ matrix.mount_path }}" \
            --ground-truth "results/${{ matrix.target_label }}/ground_truth.json" \
            --out "results/${{ matrix.target_label }}/raw_results.json" \
            --bin-dir "./bin"

      - name: ReFS Cross-Check Pass - Create, Materialize & Scan (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          REFS_DIR="results/${{ matrix.target_label }}-refs"
          mkdir -p "$REFS_DIR"
          EXTRA_ARGS=()
          if [ "${{ inputs.preset }}" = "custom" ]; then
            if [ -n "${{ inputs.files }}" ]; then
              EXTRA_ARGS+=(--files "${{ inputs.files }}")
            fi
            if [ -n "${{ inputs.logical_gb }}" ]; then
              EXTRA_ARGS+=(--logical-gb "${{ inputs.logical_gb }}")
            fi
          fi
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 create "${{ inputs.disk_size_gb }}" "Y:/bench" refs
          ./target/release/fs-mirage             --root "Y:/bench"             --preset "${{ inputs.preset }}"             --seed "${{ inputs.seed }}"             --max-physical-mb "${{ inputs.max_physical_mb }}"             --manifest-out "$REFS_DIR/ground_truth.json"             "${EXTRA_ARGS[@]}"
          python ./scripts/wrappers/run_cli_scanners.py             --path "Y:/bench"             --ground-truth "$REFS_DIR/ground_truth.json"             --out "$REFS_DIR/raw_results.json"             --bin-dir "./bin"

      - name: NTFS vs ReFS Cross-Filesystem Audit (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python ./scripts/refs_audit.py             --ntfs-results "results/${{ matrix.target_label }}/raw_results.json"             --refs-results "results/${{ matrix.target_label }}-refs/raw_results.json"             --md-out "results/${{ matrix.target_label }}/refs_audit.md"
          cat "results/${{ matrix.target_label }}/refs_audit.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Teardown ReFS Virtual Disk (Windows)
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 teardown "Y:/bench" || true

      - name: Generate Normalized Report & Append to Step Summary
        shell: bash
        run: |
          python ./scripts/report_gen.py \
            --ground-truth "results/${{ matrix.target_label }}/ground_truth.json" \
            --baseline "results/${{ matrix.target_label }}/baseline.json" \
            --raw-results "results/${{ matrix.target_label }}/raw_results.json" \
            --out "results/${{ matrix.target_label }}/benchmark_report.md" \
            --json-out "results/${{ matrix.target_label }}/normalized_results.json" \
            --title-suffix "(${{ matrix.target_label }} | ${{ inputs.preset }})"

          cat "results/${{ matrix.target_label }}/benchmark_report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Teardown Standard Virtual Disk Container
        if: always()
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            ./scripts/disk-mgr/linux_loop.sh teardown "${{ matrix.mount_path }}" || true
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            ./scripts/disk-mgr/macos_dmg.sh teardown "${{ matrix.mount_path }}" || true
          else
            powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 teardown "${{ matrix.mount_path }}" || true
          fi

      - name: Optional Linux /dev/shm RAMDisk High-IOPS Comparison Pass
        if: matrix.platform == 'linux' && inputs.enable_ramdisk == true
        shell: bash
        run: |
          RAM_LABEL="${{ matrix.target_label }}-ramdisk"
          mkdir -p "results/${RAM_LABEL}"
          case "${{ inputs.preset }}" in
            very-lite) INODES=2000000 ;;
            lite)      INODES=2000000 ;;
            low)       INODES=3000000 ;;
            mid)       INODES=6000000 ;;
            high)      INODES=9000000 ;;
            very-high) INODES=15000000 ;;
            *)         INODES=4000000 ;;
          esac

          EXTRA_ARGS=()
          if [ "${{ inputs.preset }}" = "custom" ]; then
            if [ -n "${{ inputs.files }}" ]; then
              EXTRA_ARGS+=(--files "${{ inputs.files }}")
            fi
            if [ -n "${{ inputs.logical_gb }}" ]; then
              EXTRA_ARGS+=(--logical-gb "${{ inputs.logical_gb }}")
            fi
          fi

          ./scripts/disk-mgr/linux_loop.sh create "${{ inputs.disk_size_gb }}" "${{ matrix.mount_path }}" --ramdisk --inodes "$INODES"

          ./target/release/fs-mirage \
            --root "${{ matrix.mount_path }}" \
            --preset "${{ inputs.preset }}" \
            --seed "${{ inputs.seed }}" \
            --max-physical-mb "${{ inputs.max_physical_mb }}" \
            --manifest-out "results/${RAM_LABEL}/ground_truth.json" \
            "${EXTRA_ARGS[@]}"

          ./scripts/disk-mgr/linux_loop.sh purge-cache "${{ matrix.mount_path }}"
          ./target/release/hw-probe \
            --root "${{ matrix.mount_path }}" \
            --out "results/${RAM_LABEL}/baseline.json"

          python ./scripts/wrappers/run_cli_scanners.py \
            --path "${{ matrix.mount_path }}" \
            --ground-truth "results/${RAM_LABEL}/ground_truth.json" \
            --out "results/${RAM_LABEL}/raw_results.json" \
            --bin-dir "./bin"

          python ./scripts/report_gen.py \
            --ground-truth "results/${RAM_LABEL}/ground_truth.json" \
            --baseline "results/${RAM_LABEL}/baseline.json" \
            --raw-results "results/${RAM_LABEL}/raw_results.json" \
            --out "results/${RAM_LABEL}/benchmark_report.md" \
            --json-out "results/${RAM_LABEL}/normalized_results.json" \
            --title-suffix "(${RAM_LABEL} | ${{ inputs.preset }} /dev/shm)"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat "results/${RAM_LABEL}/benchmark_report.md" >> "$GITHUB_STEP_SUMMARY"

          ./scripts/disk-mgr/linux_loop.sh teardown "${{ matrix.mount_path }}" || true

      - name: Upload Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.target_label }}-${{ inputs.preset }}
          path: results/
          retention-days: 30
