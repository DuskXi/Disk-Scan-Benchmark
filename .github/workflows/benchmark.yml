name: Cross-Platform Disk Scanner Benchmark

run-name: >-
  Bench ${{ inputs.preset }} | ${{
  inputs.preset == 'very-lite' && '100k files / 100GB' ||
  inputs.preset == 'lite' && '400k files / 350GB' ||
  inputs.preset == 'low' && '1M files / 500GB' ||
  inputs.preset == 'mid' && '3M files / 1TB' ||
  inputs.preset == 'high' && '5M files / 2TB' ||
  inputs.preset == 'very-high' && '9M files / 3TB' ||
  format('{0} files / {1}GB', inputs.files, inputs.logical_gb) }}${{
  inputs.defender_scan && ' · Defender on' || '' }}

on:
  # Triggered exclusively via manual workflow_dispatch (no schedule / cron)
  workflow_dispatch:
    inputs:
      preset:
        description: "Scale preset tier (very-lite: 100k/100GB, lite: 400k/350GB, low: 1M/500GB, mid: 3M/1TB, high: 5M/2TB, very-high: 9M/3TB, custom)"
        required: true
        default: "very-lite"
        type: choice
        options:
          - very-lite
          - lite
          - low
          - mid
          - high
          - very-high
          - custom
      files:
        description: "Custom total file items (used only when preset == 'custom')"
        required: false
        default: ""
        type: string
      logical_gb:
        description: "Custom target logical volume in GiB (used only when preset == 'custom')"
        required: false
        default: ""
        type: string
      disk_size_gb:
        description: "Virtual disk image capacity in GiB (default: 60)"
        required: true
        default: "60"
        type: string
      max_physical_mb:
        description: "Maximum physical dirty-extent allocation in MiB (default: 1500)"
        required: true
        default: "1500"
        type: string
      seed:
        description: "Deterministic PRNG seed (ChaCha8Rng)"
        required: true
        default: "42"
        type: string
      windows_only:
        description: "Run only the Windows NTFS + ReFS jobs and their summary (skip Linux/macOS)"
        required: false
        default: false
        type: boolean
      enable_ramdisk:
        description: "Enable /dev/shm RAMDisk PCIe 5.0 simulation pass on Linux"
        required: false
        default: false
        type: boolean
      windows_aging:
        description: "Generate the Windows volumes on the aged timeline (FSM_AGING=1: years-of-use creation order)"
        required: false
        default: true
        type: boolean
      defender_scan:
        description: "Windows: turn Defender real-time protection back on for the scans (bench volume not excluded)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  benchmark:
    if: ${{ !inputs.windows_only }}
    name: "Bench (${{ matrix.target_label }} | ${{ inputs.preset }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 & ARM64
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            target_label: linux-x86_64
            fs_label: ext4
            mount_path: /mnt/bench
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            target_label: linux-arm64
            fs_label: ext4
            mount_path: /mnt/bench

          # macOS x86_64 (Intel) & ARM64 (Apple Silicon)
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            target_label: macos-x86_64
            fs_label: APFS
            mount_path: /tmp/BenchVol
          - os: macos-15
            platform: macos
            arch: aarch64
            target_label: macos-arm64
            fs_label: APFS
            mount_path: /tmp/BenchVol

          # TODO (Windows ARM64):
          # Once GitHub Actions public windows-11-arm runners support elevated VHDX loop mounting
          # and native ARM64 builds for WizTree / SpaceSniffer / WinDirStat are published, uncomment:
          # - os: windows-11-arm
          #   platform: windows
          #   arch: aarch64
          #   target_label: windows-arm64
          #   mount_path: "X:/"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Cargo Registry & Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Build Core Engines (fs-mirage & hw-probe)
        shell: bash
        run: |
          cargo build --release --workspace

      - name: Cache Pinned Scanner Binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: scanners-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wrappers/scanners_registry.json') }}

      - name: Install Pinned Target Scanners (Same-Runner Provisioning)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ./scripts/wrappers/run_cli_scanners.py --install-only --bin-dir ./bin

      - name: Resolve Virtual Disk Capacity
        shell: bash
        run: |
          VDISK_GB=$(python ./scripts/disk-mgr/vdisk_capacity.py --preset "${{ inputs.preset }}" --logical-gb "${{ inputs.logical_gb }}" --min-gb "${{ inputs.disk_size_gb }}")
          echo "VDISK_GB=$VDISK_GB" >> "$GITHUB_ENV"
          echo "Virtual disk capacity: ${VDISK_GB} GiB"

      - name: Create & Mount Virtual Disk Container (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/disk-mgr/*.sh
          case "${{ inputs.preset }}" in
            very-lite) INODES=2000000 ;;
            lite)      INODES=2000000 ;;
            low)       INODES=3000000 ;;
            mid)       INODES=6000000 ;;
            high)      INODES=9000000 ;;
            very-high) INODES=15000000 ;;
            *)         INODES=4000000 ;;
          esac
          if [ "${{ matrix.platform }}" = "linux" ]; then
            ./scripts/disk-mgr/linux_loop.sh create "$VDISK_GB" "${{ matrix.mount_path }}" --inodes "$INODES"
          else
            ./scripts/disk-mgr/macos_dmg.sh create "$VDISK_GB" "${{ matrix.mount_path }}"
          fi

      - name: Materialize Deterministic Synthetic Filesystem (fs-mirage)
        shell: bash
        run: |
          mkdir -p results/${{ matrix.target_label }}
          EXTRA_ARGS=()
          if [ "${{ inputs.preset }}" = "custom" ]; then
            if [ -n "${{ inputs.files }}" ]; then
              EXTRA_ARGS+=(--files "${{ inputs.files }}")
            fi
            if [ -n "${{ inputs.logical_gb }}" ]; then
              EXTRA_ARGS+=(--logical-gb "${{ inputs.logical_gb }}")
            fi
          fi
          ./target/release/fs-mirage \
            --root "${{ matrix.mount_path }}" \
            --preset "${{ inputs.preset }}" \
            --seed "${{ inputs.seed }}" \
            --max-physical-mb "${{ inputs.max_physical_mb }}" \
            --manifest-out "results/${{ matrix.target_label }}/ground_truth.json" \
            "${EXTRA_ARGS[@]}"

      - name: Measure Hardware Ceiling Baseline (hw-probe)
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            ./scripts/disk-mgr/linux_loop.sh purge-cache "${{ matrix.mount_path }}"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            ./scripts/disk-mgr/macos_dmg.sh purge-cache "${{ matrix.mount_path }}"
          else
            powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 purge-cache "${{ matrix.mount_path }}"
          fi

          ./target/release/hw-probe \
            --root "${{ matrix.mount_path }}" \
            --out "results/${{ matrix.target_label }}/baseline.json"

      - name: Run All Platform Scanners Sequentially on Same Instance
        shell: bash
        run: |
          python ./scripts/wrappers/run_cli_scanners.py \
            --path "${{ matrix.mount_path }}" \
            --ground-truth "results/${{ matrix.target_label }}/ground_truth.json" \
            --out "results/${{ matrix.target_label }}/raw_results.json" \
            --bin-dir "./bin"

      - name: Generate Normalized Report
        shell: bash
        run: |
          python ./scripts/report_gen.py \
            --ground-truth "results/${{ matrix.target_label }}/ground_truth.json" \
            --baseline "results/${{ matrix.target_label }}/baseline.json" \
            --raw-results "results/${{ matrix.target_label }}/raw_results.json" \
            --out "results/${{ matrix.target_label }}/benchmark_report.md" \
            --json-out "results/${{ matrix.target_label }}/normalized_results.json" \
            --title-suffix "(${{ matrix.target_label }} · ${{ matrix.fs_label }} | ${{ inputs.preset }})"

          cat "results/${{ matrix.target_label }}/benchmark_report.md"

      - name: Teardown Standard Virtual Disk Container
        if: always()
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            ./scripts/disk-mgr/linux_loop.sh teardown "${{ matrix.mount_path }}" || true
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            ./scripts/disk-mgr/macos_dmg.sh teardown "${{ matrix.mount_path }}" || true
          else
            powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 teardown "${{ matrix.mount_path }}" || true
          fi

      - name: Optional Linux /dev/shm RAMDisk High-IOPS Comparison Pass
        if: matrix.platform == 'linux' && inputs.enable_ramdisk == true
        shell: bash
        run: |
          RAM_LABEL="${{ matrix.target_label }}-ramdisk"
          mkdir -p "results/${RAM_LABEL}"
          case "${{ inputs.preset }}" in
            very-lite) INODES=2000000 ;;
            lite)      INODES=2000000 ;;
            low)       INODES=3000000 ;;
            mid)       INODES=6000000 ;;
            high)      INODES=9000000 ;;
            very-high) INODES=15000000 ;;
            *)         INODES=4000000 ;;
          esac

          EXTRA_ARGS=()
          if [ "${{ inputs.preset }}" = "custom" ]; then
            if [ -n "${{ inputs.files }}" ]; then
              EXTRA_ARGS+=(--files "${{ inputs.files }}")
            fi
            if [ -n "${{ inputs.logical_gb }}" ]; then
              EXTRA_ARGS+=(--logical-gb "${{ inputs.logical_gb }}")
            fi
          fi

          ./scripts/disk-mgr/linux_loop.sh create "${{ inputs.disk_size_gb }}" "${{ matrix.mount_path }}" --ramdisk --inodes "$INODES"

          ./target/release/fs-mirage \
            --root "${{ matrix.mount_path }}" \
            --preset "${{ inputs.preset }}" \
            --seed "${{ inputs.seed }}" \
            --max-physical-mb "${{ inputs.max_physical_mb }}" \
            --no-prealloc \
            --manifest-out "results/${RAM_LABEL}/ground_truth.json" \
            "${EXTRA_ARGS[@]}"

          ./scripts/disk-mgr/linux_loop.sh purge-cache "${{ matrix.mount_path }}"
          ./target/release/hw-probe \
            --root "${{ matrix.mount_path }}" \
            --out "results/${RAM_LABEL}/baseline.json"

          python ./scripts/wrappers/run_cli_scanners.py \
            --path "${{ matrix.mount_path }}" \
            --ground-truth "results/${RAM_LABEL}/ground_truth.json" \
            --out "results/${RAM_LABEL}/raw_results.json" \
            --bin-dir "./bin"

          python ./scripts/report_gen.py \
            --ground-truth "results/${RAM_LABEL}/ground_truth.json" \
            --baseline "results/${RAM_LABEL}/baseline.json" \
            --raw-results "results/${RAM_LABEL}/raw_results.json" \
            --out "results/${RAM_LABEL}/benchmark_report.md" \
            --json-out "results/${RAM_LABEL}/normalized_results.json" \
            --title-suffix "(${RAM_LABEL} | ${{ inputs.preset }} /dev/shm)"

          cat "results/${RAM_LABEL}/benchmark_report.md"

          ./scripts/disk-mgr/linux_loop.sh teardown "${{ matrix.mount_path }}" || true

      - name: Upload Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.target_label }}-${{ inputs.preset }}
          path: results/
          retention-days: 30

  benchmark-ntfs:
    name: "Bench (windows-x86_64 | ${{ inputs.preset }})"
    runs-on: windows-latest
    env:
      LABEL: windows-x86_64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Cargo Registry & Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Build Core Engines (fs-mirage & hw-probe)
        shell: bash
        run: cargo build --release --workspace

      - name: Cache Pinned Scanner Binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: scanners-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wrappers/scanners_registry.json') }}

      - name: Install Pinned Target Scanners
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ./scripts/wrappers/run_cli_scanners.py --install-only --bin-dir ./bin

      - name: Resolve Virtual Disk Capacity
        shell: bash
        run: |
          VDISK_GB=$(python ./scripts/disk-mgr/vdisk_capacity.py --preset "${{ inputs.preset }}" --logical-gb "${{ inputs.logical_gb }}" --min-gb "${{ inputs.disk_size_gb }}")
          echo "VDISK_GB=$VDISK_GB" >> "$GITHUB_ENV"
          echo "Virtual disk capacity: ${VDISK_GB} GiB"

      - name: "Create & Mount Dynamic NTFS VHDX (Windows)"
        shell: pwsh
        run: ./scripts/disk-mgr/windows_vhd.ps1 create "${{ env.VDISK_GB }}" "X:/bench" ntfs

      - name: Start Disk Space Monitor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "results/$env:LABEL" | Out-Null
          Start-Process -FilePath powershell -WindowStyle Hidden -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','scripts/ci/disk_monitor.ps1','-Out',"results/$env:LABEL/disk_monitor.csv"

      - name: Materialize Deterministic Synthetic Filesystem (fs-mirage)
        shell: bash
        env:
          # aged creation timeline (scattered MFT records, directory indexes grown in pieces); same final tree
          FSM_AGING: ${{ inputs.windows_aging && '1' || '0' }}
        run: |
          mkdir -p "results/$LABEL"
          EXTRA_ARGS=()
          if [ "${{ inputs.preset }}" = "custom" ]; then
            if [ -n "${{ inputs.files }}" ]; then
              EXTRA_ARGS+=(--files "${{ inputs.files }}")
            fi
            if [ -n "${{ inputs.logical_gb }}" ]; then
              EXTRA_ARGS+=(--logical-gb "${{ inputs.logical_gb }}")
            fi
          fi
          ./target/release/fs-mirage \
            --root "X:/bench" \
            --preset "${{ inputs.preset }}" \
            --seed "${{ inputs.seed }}" \
            --max-physical-mb "${{ inputs.max_physical_mb }}" \
            --manifest-out "results/$LABEL/ground_truth.json" \
            "${EXTRA_ARGS[@]}"

      - name: Measure Hardware Ceiling Baseline on NTFS (hw-probe)
        shell: bash
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 purge-cache "X:/bench"
          ./target/release/hw-probe \
            --root "X:/bench" \
            --out "results/$LABEL/baseline.json"

      - name: Defender On For Scans
        if: ${{ inputs.defender_scan }}
        shell: pwsh
        run: ./scripts/disk-mgr/windows_vhd.ps1 defender-on "X:/bench"

      - name: Run All Windows Scanners on NTFS
        shell: bash
        run: |
          python ./scripts/wrappers/run_cli_scanners.py \
            --path "X:/bench" \
            --ground-truth "results/$LABEL/ground_truth.json" \
            --out "results/$LABEL/raw_results.json" \
            --bin-dir "./bin"

      - name: Disk Space Monitor Report
        if: always()
        shell: pwsh
        run: |
          Write-Host "time, C free GB, D free GB, X free GB, VHDX GB (tail of the monitor log)"
          Get-Content "results/$env:LABEL/disk_monitor.csv" -Tail 40 -ErrorAction SilentlyContinue
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}} -AutoSize

      - name: Teardown NTFS Virtual Disk
        if: always()
        shell: bash
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 teardown "X:/bench" || true

      - name: Upload NTFS Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-windows-x86_64-${{ inputs.preset }}
          path: results/
          retention-days: 30

  # Windows on ARM (native arm64 builds of gdu, dua, dust, SpaceKnife and WinDirStat; x64-only scanners are skipped
  # rather than timed under emulation). A job of its own so the x64 NTFS+ReFS summary never waits for it.
  benchmark-ntfs-arm64:
    name: "Bench (windows-arm64 | ${{ inputs.preset }})"
    runs-on: windows-11-arm
    env:
      LABEL: windows-arm64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.12 (native arm64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Cache Cargo Registry & Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Build Core Engines (fs-mirage & hw-probe)
        shell: bash
        run: |
          rustc -vV | grep host
          cargo build --release --workspace

      - name: Cache Pinned Scanner Binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: scanners-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wrappers/scanners_registry.json') }}

      - name: Install Pinned Target Scanners
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import platform, sys; print('python', sys.version, platform.machine())"
          python ./scripts/wrappers/run_cli_scanners.py --install-only --bin-dir ./bin

      - name: Resolve Virtual Disk Capacity
        shell: bash
        run: |
          VDISK_GB=$(python ./scripts/disk-mgr/vdisk_capacity.py --preset "${{ inputs.preset }}" --logical-gb "${{ inputs.logical_gb }}" --min-gb "${{ inputs.disk_size_gb }}")
          echo "VDISK_GB=$VDISK_GB" >> "$GITHUB_ENV"
          echo "Virtual disk capacity: ${VDISK_GB} GiB"

      - name: "Create & Mount Dynamic NTFS VHDX (Windows)"
        shell: pwsh
        run: ./scripts/disk-mgr/windows_vhd.ps1 create "${{ env.VDISK_GB }}" "X:/bench" ntfs

      - name: Start Disk Space Monitor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "results/$env:LABEL" | Out-Null
          Start-Process -FilePath powershell -WindowStyle Hidden -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','scripts/ci/disk_monitor.ps1','-Out',"results/$env:LABEL/disk_monitor.csv"

      - name: Materialize Deterministic Synthetic Filesystem (fs-mirage)
        shell: bash
        env:
          # aged creation timeline (scattered MFT records, directory indexes grown in pieces); same final tree
          FSM_AGING: ${{ inputs.windows_aging && '1' || '0' }}
        run: |
          mkdir -p "results/$LABEL"
          EXTRA_ARGS=()
          if [ "${{ inputs.preset }}" = "custom" ]; then
            if [ -n "${{ inputs.files }}" ]; then
              EXTRA_ARGS+=(--files "${{ inputs.files }}")
            fi
            if [ -n "${{ inputs.logical_gb }}" ]; then
              EXTRA_ARGS+=(--logical-gb "${{ inputs.logical_gb }}")
            fi
          fi
          ./target/release/fs-mirage \
            --root "X:/bench" \
            --preset "${{ inputs.preset }}" \
            --seed "${{ inputs.seed }}" \
            --max-physical-mb "${{ inputs.max_physical_mb }}" \
            --manifest-out "results/$LABEL/ground_truth.json" \
            "${EXTRA_ARGS[@]}"

      - name: Measure Hardware Ceiling Baseline on NTFS (hw-probe)
        shell: bash
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 purge-cache "X:/bench"
          ./target/release/hw-probe \
            --root "X:/bench" \
            --out "results/$LABEL/baseline.json"

      - name: Defender On For Scans
        if: ${{ inputs.defender_scan }}
        shell: pwsh
        run: ./scripts/disk-mgr/windows_vhd.ps1 defender-on "X:/bench"

      - name: Run All Windows Scanners on NTFS
        shell: bash
        run: |
          python ./scripts/wrappers/run_cli_scanners.py \
            --path "X:/bench" \
            --ground-truth "results/$LABEL/ground_truth.json" \
            --out "results/$LABEL/raw_results.json" \
            --bin-dir "./bin"

      - name: Disk Space Monitor Report
        if: always()
        shell: pwsh
        run: |
          Write-Host "time, C free GB, D free GB, X free GB, VHDX GB (tail of the monitor log)"
          Get-Content "results/$env:LABEL/disk_monitor.csv" -Tail 40 -ErrorAction SilentlyContinue
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}} -AutoSize

      - name: Teardown NTFS Virtual Disk
        if: always()
        shell: bash
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 teardown "X:/bench" || true

      - name: Windows ARM64 Report
        if: always()
        shell: bash
        run: |
          if [ -f "results/$LABEL/raw_results.json" ]; then
            python ./scripts/report_gen.py \
              --ground-truth "results/$LABEL/ground_truth.json" \
              --baseline "results/$LABEL/baseline.json" \
              --raw-results "results/$LABEL/raw_results.json" \
              --out "results/$LABEL/benchmark_report.md" \
              --json-out "results/$LABEL/normalized_results.json" \
              --title-suffix "(windows-arm64 NTFS | ${{ inputs.preset }}${{ inputs.defender_scan && ' · Defender on' || '' }})"
            cat "results/$LABEL/benchmark_report.md"
          fi

      - name: Upload NTFS Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-windows-arm64-${{ inputs.preset }}
          path: results/
          retention-days: 30

  benchmark-refs:
    name: "Bench (windows-x86_64-refs | ${{ inputs.preset }})"
    runs-on: windows-latest
    env:
      LABEL: windows-x86_64-refs
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Cargo Registry & Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Build Core Engines (fs-mirage & hw-probe)
        shell: bash
        run: cargo build --release --workspace

      - name: Cache Pinned Scanner Binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: scanners-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wrappers/scanners_registry.json') }}

      - name: Install Pinned Target Scanners
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ./scripts/wrappers/run_cli_scanners.py --install-only --bin-dir ./bin

      - name: Resolve Virtual Disk Capacity
        shell: bash
        run: |
          VDISK_GB=$(python ./scripts/disk-mgr/vdisk_capacity.py --preset "${{ inputs.preset }}" --logical-gb "${{ inputs.logical_gb }}" --min-gb "${{ inputs.disk_size_gb }}")
          echo "VDISK_GB=$VDISK_GB" >> "$GITHUB_ENV"
          echo "Virtual disk capacity: ${VDISK_GB} GiB"

      - name: "Create & Mount Dynamic ReFS VHDX (Windows)"
        shell: pwsh
        run: ./scripts/disk-mgr/windows_vhd.ps1 create "${{ env.VDISK_GB }}" "X:/bench" refs

      # Preallocated like on NTFS: with --no-prealloc the media and the >=256 KiB files were sparse on ReFS only, and
      # scanners that size sparse files exactly (SpaceKnife, WinDirStat) paid for it on ReFS alone, which skews the
      # NTFS-vs-ReFS cross-check. A plain SetEndOfFile on ReFS reserves clusters without writing zeros (verified on a
      # local ReFS 3.14 volume and on the runner: very-lite allocated 102 GB with a 1.5 GB VHDX). ReFS generation grows
      # much faster than linearly on the runner (low ~2.5 min, mid ~35 min, high ~1.6 h before this change), so the
      # timeout only guards against a real hang.
      - name: Materialize Deterministic Synthetic Filesystem (fs-mirage)
        shell: bash
        env:
          # aged creation timeline (scattered MFT records, directory indexes grown in pieces); same final tree
          FSM_AGING: ${{ inputs.windows_aging && '1' || '0' }}
        timeout-minutes: 300
        run: |
          mkdir -p "results/$LABEL"
          EXTRA_ARGS=()
          if [ "${{ inputs.preset }}" = "custom" ]; then
            if [ -n "${{ inputs.files }}" ]; then
              EXTRA_ARGS+=(--files "${{ inputs.files }}")
            fi
            if [ -n "${{ inputs.logical_gb }}" ]; then
              EXTRA_ARGS+=(--logical-gb "${{ inputs.logical_gb }}")
            fi
          fi
          ./target/release/fs-mirage \
            --root "X:/bench" \
            --preset "${{ inputs.preset }}" \
            --seed "${{ inputs.seed }}" \
            --max-physical-mb "${{ inputs.max_physical_mb }}" \
            --manifest-out "results/$LABEL/ground_truth.json" \
            "${EXTRA_ARGS[@]}"
          powershell -NoProfile -Command '$p = (Get-Content (Join-Path $env:TEMP "disk_scanner_bench_X.vhdpath") -Raw).Trim(); $v = Get-Volume -DriveLetter X; "ReFS after generation: VHDX {0:N1} GB physical | X: used {1:N1} of {2:N0} GB | D: free {3:N1} GB" -f ((Get-Item $p).Length / 1GB), (($v.Size - $v.SizeRemaining) / 1GB), ($v.Size / 1GB), ((Get-PSDrive D).Free / 1GB)' || true

      - name: Measure Hardware Ceiling Baseline on ReFS (hw-probe)
        shell: bash
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 purge-cache "X:/bench"
          ./target/release/hw-probe \
            --root "X:/bench" \
            --out "results/$LABEL/baseline.json"

      - name: Defender On For Scans
        if: ${{ inputs.defender_scan }}
        shell: pwsh
        run: ./scripts/disk-mgr/windows_vhd.ps1 defender-on "X:/bench"

      - name: Run All Windows Scanners on ReFS
        shell: bash
        run: |
          python ./scripts/wrappers/run_cli_scanners.py \
            --path "X:/bench" \
            --ground-truth "results/$LABEL/ground_truth.json" \
            --out "results/$LABEL/raw_results.json" \
            --bin-dir "./bin"

      - name: Teardown ReFS Virtual Disk
        if: always()
        shell: bash
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 teardown "X:/bench" || true

      - name: Upload ReFS Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-windows-x86_64-refs-${{ inputs.preset }}
          path: results/
          retention-days: 30

  windows-summary:
    name: "Windows NTFS+ReFS Summary (${{ inputs.preset }})"
    needs: [benchmark-ntfs, benchmark-refs]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download NTFS & ReFS Windows Results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-windows-x86_64*-${{ inputs.preset }}
          path: results/
          merge-multiple: true

      - name: NTFS vs ReFS Cross-Filesystem Audit & Windows Report
        shell: bash
        run: |
          N="results/windows-x86_64"
          R="results/windows-x86_64-refs"
          if [ ! -f "$N/raw_results.json" ]; then
            echo "::error::NTFS raw_results.json missing; cannot build Windows report"
            exit 1
          fi
          if [ -f "$R/raw_results.json" ]; then
            python ./scripts/refs_audit.py \
              --ntfs-results "$N/raw_results.json" \
              --refs-results "$R/raw_results.json" \
              --md-out "$N/refs_audit.md"
          else
            echo "> [!WARNING]
          > ReFS run produced no results; NTFS vs ReFS cross-check skipped." > "$N/refs_audit.md"
          fi

          python ./scripts/report_gen.py \
            --ground-truth "$N/ground_truth.json" \
            --baseline "$N/baseline.json" \
            --raw-results "$N/raw_results.json" \
            --out "$N/benchmark_report.md" \
            --json-out "$N/normalized_results.json" \
            --title-suffix "(windows-x86_64 | ${{ inputs.preset }}${{ inputs.defender_scan && ' · Defender on' || '' }})" \
            --cross-fs-checked

          if [ -f "$R/raw_results.json" ]; then
            python ./scripts/report_gen.py \
              --ground-truth "$R/ground_truth.json" \
              --baseline "$R/baseline.json" \
              --raw-results "$R/raw_results.json" \
              --out "$R/benchmark_report.md" \
              --json-out "$R/normalized_results.json" \
              --title-suffix "(windows-x86_64 ReFS | ${{ inputs.preset }}${{ inputs.defender_scan && ' · Defender on' || '' }})" \
              --cross-fs-checked
          fi

          cat "$N/benchmark_report.md"
          echo ""
          if [ -f "$R/benchmark_report.md" ]; then
            cat "$R/benchmark_report.md"
            echo ""
          fi
          cat "$N/refs_audit.md"

      - name: Upload Final Windows Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-windows-final-${{ inputs.preset }}
          path: results/
          retention-days: 30

  # GitHub lists job summaries in the order the jobs finish, so the overall leaderboard can only sit at the top if
  # one last job writes the whole summary: the leaderboard first, then every platform's full report below it.
  # The platform jobs print their own report into their job log instead.
  leaderboard:
    name: "Overall Leaderboard (${{ inputs.preset }})"
    needs: [benchmark, benchmark-ntfs-arm64, windows-summary]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # publishes the README leaderboard and badge files to main
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download All Platform Results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-*-${{ inputs.preset }}
          path: artifacts/

      - name: Build Leaderboard & Write Run Summary
        shell: bash
        run: |
          mkdir -p lb-out
          python ./scripts/leaderboard.py \
            --artifacts artifacts \
            --preset "${{ inputs.preset }}${{ inputs.defender_scan && ' · Defender on' || '' }}" \
            --sha "${{ github.sha }}" \
            --out lb-out/leaderboard.md \
            --json-out lb-out/leaderboard.json \
            --summary-out lb-out/summary.md
          cat lb-out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Leaderboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-leaderboard-${{ inputs.preset }}
          path: lb-out/
          retention-days: 30

      # Only plain runs of a standard preset on main reach the README; experiments (Defender on, fresh timeline,
      # custom sizes) and runs with failed platforms stay in their own run summary.
      - name: Publish Leaderboard To README
        if: >-
          github.ref == 'refs/heads/main' && inputs.preset != 'custom' &&
          !inputs.defender_scan && inputs.windows_aging
        shell: bash
        run: bash ./scripts/ci/publish_board.sh lb-out/leaderboard.json standard "${{ inputs.preset }}"
