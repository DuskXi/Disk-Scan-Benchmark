name: Cross-Platform Disk Scanner Benchmark

run-name: >-
  Bench ${{ inputs.preset }} | ${{
  inputs.preset == 'very-lite' && '100k files / 100GB' ||
  inputs.preset == 'lite' && '400k files / 350GB' ||
  inputs.preset == 'low' && '1M files / 500GB' ||
  inputs.preset == 'mid' && '3M files / 1TB' ||
  inputs.preset == 'high' && '5M files / 2TB' ||
  inputs.preset == 'very-high' && '9M files / 3TB' ||
  inputs.preset == 'before-death' && '14M files / 3.6TB' ||
  format('{0} files / {1}GB', inputs.files, inputs.logical_gb) }}${{
  inputs.defender_scan && ' · Defender on' || '' }}

on:
  # Triggered exclusively via manual workflow_dispatch (no schedule / cron)
  workflow_dispatch:
    inputs:
      preset:
        description: "Scale preset tier (very-lite: 100k/100GB, lite: 400k/350GB, low: 1M/500GB, mid: 3M/1TB, high: 5M/2TB, very-high: 9M/3TB, before-death: 14M/3.6TB, custom)"
        required: true
        default: "very-lite"
        type: choice
        options:
          - very-lite
          - lite
          - low
          - mid
          - high
          - very-high
          - before-death
          - custom
      files:
        description: "Custom total file items (used only when preset == 'custom')"
        required: false
        default: ""
        type: string
      logical_gb:
        description: "Custom target logical volume in GiB (used only when preset == 'custom')"
        required: false
        default: ""
        type: string
      disk_size_gb:
        description: "Virtual disk image capacity in GiB (default: 60)"
        required: true
        default: "60"
        type: string
      max_physical_mb:
        description: "Maximum physical dirty-extent allocation in MiB (default: 1500)"
        required: true
        default: "1500"
        type: string
      seed:
        description: "Deterministic PRNG seed (ChaCha8Rng)"
        required: true
        default: "42"
        type: string
      windows_only:
        description: "Run only the Windows NTFS + ReFS jobs and their summary (skip Linux/macOS)"
        required: false
        default: false
        type: boolean
      enable_ramdisk:
        description: "Enable /dev/shm RAMDisk PCIe 5.0 simulation pass on Linux"
        required: false
        default: false
        type: boolean
      aging:
        description: "Generate every volume on the aged timeline (years-of-use creation order; off = FSM_AGING=0)"
        required: false
        default: true
        type: boolean
      defender_scan:
        description: "Windows: turn Defender real-time protection back on for the scans (bench volume not excluded)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Each scanner's progress reaches the log as it happens: block-buffered output on a pipe was lost whenever a
  # job hit its time limit, which left no trace of how far the scans had got
  PYTHONUNBUFFERED: "1"
  # Timed scans with the daily-use access-time setting (linux_loop.sh mounts relatime and creates the ZFS pool with
  # atime + relatime, windows_vhd.ps1 turns NTFS last-access updates on; ReFS and macOS keep what they ship with).
  # run_cli_scanners.py --reset-atime sets every access time two days back before each scanner's cold scan.
  BENCH_ATIME: daily

jobs:
  # The Linux / macOS targets of the benchmark job. high and up leave macOS out: its scans (and the access-time reset
  # before each cold scan) run past the 6-hour job limit there, so benchmark-sharded.yml splits them over several jobs
  # (sharded-macos below). A matrix exclude cannot
  # drop entries added by include, hence this job.
  targets:
    name: "Targets (${{ inputs.preset }})"
    if: ${{ !inputs.windows_only }}
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pick The Targets
        id: pick
        shell: bash
        env:
          SHARDED: ${{ contains(fromJSON('["high","very-high","before-death"]'), inputs.preset) }}
        run: |
          # Linux x86_64 & ARM64 (ext4), macOS x86_64 (Intel) & ARM64 (Apple Silicon) on their native APFS volume,
          # then the Linux filesystems beyond ext4 (same loop device, same tree).
          # TODO (Windows ARM64 here): once windows-11-arm runners can loop-mount VHDX elevated and native ARM64
          # builds of WizTree / SpaceSniffer exist; until then benchmark-ntfs-arm64 below runs it.
          cat > targets.json <<'JSON'
          [
            {"os": "ubuntu-24.04", "platform": "linux", "arch": "x86_64", "target_label": "linux-x86_64", "fs": "ext4", "fs_label": "ext4", "mount_path": "/mnt/bench"},
            {"os": "ubuntu-24.04-arm", "platform": "linux", "arch": "aarch64", "target_label": "linux-arm64", "fs": "ext4", "fs_label": "ext4", "mount_path": "/mnt/bench"},
            {"os": "macos-15-intel", "platform": "macos", "arch": "x86_64", "target_label": "macos-x86_64", "fs": "apfs", "fs_label": "APFS", "mount_path": "/tmp/BenchVol"},
            {"os": "macos-15", "platform": "macos", "arch": "aarch64", "target_label": "macos-arm64", "fs": "apfs", "fs_label": "APFS", "mount_path": "/tmp/BenchVol"},
            {"os": "ubuntu-24.04", "platform": "linux", "arch": "x86_64", "target_label": "linux-x86_64-btrfs", "fs": "btrfs", "fs_label": "Btrfs", "mount_path": "/mnt/bench"},
            {"os": "ubuntu-24.04", "platform": "linux", "arch": "x86_64", "target_label": "linux-x86_64-xfs", "fs": "xfs", "fs_label": "XFS", "mount_path": "/mnt/bench"},
            {"os": "ubuntu-24.04", "platform": "linux", "arch": "x86_64", "target_label": "linux-x86_64-zfs", "fs": "zfs", "fs_label": "ZFS", "mount_path": "/mnt/bench"},
            {"os": "ubuntu-24.04-arm", "platform": "linux", "arch": "aarch64", "target_label": "linux-arm64-btrfs", "fs": "btrfs", "fs_label": "Btrfs", "mount_path": "/mnt/bench"},
            {"os": "ubuntu-24.04-arm", "platform": "linux", "arch": "aarch64", "target_label": "linux-arm64-xfs", "fs": "xfs", "fs_label": "XFS", "mount_path": "/mnt/bench"},
            {"os": "ubuntu-24.04-arm", "platform": "linux", "arch": "aarch64", "target_label": "linux-arm64-zfs", "fs": "zfs", "fs_label": "ZFS", "mount_path": "/mnt/bench"}
          ]
          JSON
          python3 ./scripts/ci/pick_targets.py targets.json "$SHARDED" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  benchmark:
    needs: targets
    if: ${{ !inputs.windows_only }}
    name: "Bench (${{ matrix.target_label }} | ${{ inputs.preset }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.include) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Cargo Registry & Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Build Core Engines (fs-mirage & hw-probe)
        shell: bash
        run: |
          cargo build --release --workspace

      - name: Cache Pinned Scanner Binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: scanners-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wrappers/scanners_registry.json') }}

      - name: Install Pinned Target Scanners (Same-Runner Provisioning)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ./scripts/wrappers/run_cli_scanners.py --install-only --bin-dir ./bin

      - name: Resolve Virtual Disk Capacity
        shell: bash
        run: |
          VDISK_GB=$(python ./scripts/disk-mgr/vdisk_capacity.py --preset "${{ inputs.preset }}" --logical-gb "${{ inputs.logical_gb }}" --min-gb "${{ inputs.disk_size_gb }}")
          echo "VDISK_GB=$VDISK_GB" >> "$GITHUB_ENV"
          echo "Virtual disk capacity: ${VDISK_GB} GiB"

      - name: Install Filesystem Tools (Btrfs / XFS / ZFS)
        if: matrix.platform == 'linux' && matrix.fs != 'ext4'
        shell: bash
        run: |
          case "${{ matrix.fs }}" in
            btrfs) pkg=btrfs-progs; mod=btrfs ;;
            xfs)   pkg=xfsprogs; mod=xfs ;;
            zfs)   pkg=zfsutils-linux; mod=zfs ;;
          esac
          sudo apt-get update -qq
          sudo apt-get install -y -qq "$pkg"
          sudo modprobe "$mod" || { sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" && sudo modprobe "$mod"; }
          echo "kernel $(uname -r)"
          if [ "$mod" = "zfs" ]; then zfs version; fi

      - name: Create & Mount Virtual Disk Container (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/disk-mgr/*.sh
          case "${{ inputs.preset }}" in
            very-lite) INODES=2000000 ;;
            lite)      INODES=2000000 ;;
            low)       INODES=3000000 ;;
            mid)       INODES=6000000 ;;
            high)      INODES=9000000 ;;
            very-high) INODES=15000000 ;;
            before-death) INODES=24000000 ;;
            *)         INODES=4000000 ;;
          esac
          if [ "${{ matrix.platform }}" = "linux" ]; then
            ./scripts/disk-mgr/linux_loop.sh create "$VDISK_GB" "${{ matrix.mount_path }}" --inodes "$INODES" --fs "${{ matrix.fs }}"
          else
            ./scripts/disk-mgr/macos_dmg.sh create "$VDISK_GB" "${{ matrix.mount_path }}"
          fi

      - name: Materialize Deterministic Synthetic Filesystem (fs-mirage)
        shell: bash
        env:
          # aged creation timeline (scattered records, directory indexes grown in pieces); same final tree
          FSM_AGING: ${{ inputs.aging && '1' || '0' }}
        run: |
          mkdir -p results/${{ matrix.target_label }}
          EXTRA_ARGS=()
          if [ "${{ inputs.preset }}" = "custom" ]; then
            if [ -n "${{ inputs.files }}" ]; then
              EXTRA_ARGS+=(--files "${{ inputs.files }}")
            fi
            if [ -n "${{ inputs.logical_gb }}" ]; then
              EXTRA_ARGS+=(--logical-gb "${{ inputs.logical_gb }}")
            fi
          fi
          GEN_ARGS=(
            --root "${{ matrix.mount_path }}"
            --preset "${{ inputs.preset }}"
            --seed "${{ inputs.seed }}"
            --max-physical-mb "${{ inputs.max_physical_mb }}"
            --manifest-out "results/${{ matrix.target_label }}/ground_truth.json"
            "${EXTRA_ARGS[@]}"
          )
          ./target/release/fs-mirage "${GEN_ARGS[@]}"
          # Btrfs, XFS and ZFS settle block counts only after the data is flushed: recount after a remount
          if [ "${{ matrix.platform }}" = "linux" ] && [ "${{ matrix.fs }}" != "ext4" ]; then
            ./scripts/disk-mgr/linux_loop.sh purge-cache "${{ matrix.mount_path }}"
            ./target/release/fs-mirage "${GEN_ARGS[@]}" --recount-alloc
          fi

      # macOS x64 runners walk a large tree slowly (a mid scan takes 3-5 hours): from mid up the extra full walks of the
      # layout probe and hw-probe's B_meta traversal are skipped there so the scans fit in the 6-hour job limit
      - name: Probe On-Disk Layout (how aged the tree looks; aggregates only)
        if: ${{ !(matrix.platform == 'macos' && contains(fromJSON('["mid","high","very-high","before-death"]'), inputs.preset)) }}
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: python ./scripts/profile/layout_probe.py "${{ matrix.mount_path }}" --json-out "results/${{ matrix.target_label }}/layout.json" > /dev/null || true

      - name: Measure Hardware Ceiling Baseline (hw-probe)
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            ./scripts/disk-mgr/linux_loop.sh purge-cache "${{ matrix.mount_path }}"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            ./scripts/disk-mgr/macos_dmg.sh purge-cache "${{ matrix.mount_path }}"
          else
            powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 purge-cache "${{ matrix.mount_path }}"
          fi

          # ZFS caches data in its ARC whatever O_DIRECT asks for; cache only metadata while the probe reads its file
          if [ "${{ matrix.fs }}" = "zfs" ]; then sudo zfs set primarycache=metadata benchpool; fi
          SKIP_META=()
          if [ "${{ matrix.platform == 'macos' && contains(fromJSON('["mid","high","very-high","before-death"]'), inputs.preset) }}" = "true" ]; then SKIP_META=(--skip-meta); fi
          ./target/release/hw-probe \
            --root "${{ matrix.mount_path }}" \
            --out "results/${{ matrix.target_label }}/baseline.json" \
            "${SKIP_META[@]}"
          if [ "${{ matrix.fs }}" = "zfs" ]; then sudo zfs set primarycache=all benchpool; fi

      - name: Run All Platform Scanners Sequentially on Same Instance
        shell: bash
        run: |
          # macOS x64 scans a mid tree in ~250 min and its warm scans are as slow as its cold ones: from high up one
          # warm scan instead of three keeps the job inside the 6-hour limit
          WARM_RUNS=3
          if [ "${{ matrix.target_label == 'macos-x86_64' && contains(fromJSON('["high","very-high","before-death"]'), inputs.preset) }}" = "true" ]; then
            WARM_RUNS=1
          fi
          python ./scripts/wrappers/run_cli_scanners.py \
            --path "${{ matrix.mount_path }}" \
            --ground-truth "results/${{ matrix.target_label }}/ground_truth.json" \
            --out "results/${{ matrix.target_label }}/raw_results.json" \
            --bin-dir "./bin" \
            --warm-runs "$WARM_RUNS" \
            --reset-atime

      - name: Generate Normalized Report
        shell: bash
        run: |
          python ./scripts/report_gen.py \
            --ground-truth "results/${{ matrix.target_label }}/ground_truth.json" \
            --baseline "results/${{ matrix.target_label }}/baseline.json" \
            --raw-results "results/${{ matrix.target_label }}/raw_results.json" \
            --out "results/${{ matrix.target_label }}/benchmark_report.md" \
            --json-out "results/${{ matrix.target_label }}/normalized_results.json" \
            --title-suffix "(${{ matrix.target_label }} · ${{ matrix.fs_label }} | ${{ inputs.preset }})"

          cat "results/${{ matrix.target_label }}/benchmark_report.md"

      # before the teardown: a job that runs out of time while detaching the disk still keeps its results
      - name: Upload Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.target_label }}-${{ inputs.preset }}
          path: results/
          retention-days: 30

      - name: Teardown Standard Virtual Disk Container
        if: always()
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            ./scripts/disk-mgr/linux_loop.sh teardown "${{ matrix.mount_path }}" || true
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            ./scripts/disk-mgr/macos_dmg.sh teardown "${{ matrix.mount_path }}" || true
          else
            powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 teardown "${{ matrix.mount_path }}" || true
          fi

      - name: Optional Linux /dev/shm RAMDisk High-IOPS Comparison Pass
        if: matrix.platform == 'linux' && matrix.fs == 'ext4' && inputs.enable_ramdisk == true
        shell: bash
        env:
          FSM_AGING: ${{ inputs.aging && '1' || '0' }}
        run: |
          RAM_LABEL="${{ matrix.target_label }}-ramdisk"
          # its own folder and artifact: the main results are already uploaded
          RAM_OUT="results-ramdisk/${RAM_LABEL}"
          mkdir -p "$RAM_OUT"
          case "${{ inputs.preset }}" in
            very-lite) INODES=2000000 ;;
            lite)      INODES=2000000 ;;
            low)       INODES=3000000 ;;
            mid)       INODES=6000000 ;;
            high)      INODES=9000000 ;;
            very-high) INODES=15000000 ;;
            before-death) INODES=24000000 ;;
            *)         INODES=4000000 ;;
          esac

          EXTRA_ARGS=()
          if [ "${{ inputs.preset }}" = "custom" ]; then
            if [ -n "${{ inputs.files }}" ]; then
              EXTRA_ARGS+=(--files "${{ inputs.files }}")
            fi
            if [ -n "${{ inputs.logical_gb }}" ]; then
              EXTRA_ARGS+=(--logical-gb "${{ inputs.logical_gb }}")
            fi
          fi

          ./scripts/disk-mgr/linux_loop.sh create "${{ inputs.disk_size_gb }}" "${{ matrix.mount_path }}" --ramdisk --inodes "$INODES"

          ./target/release/fs-mirage \
            --root "${{ matrix.mount_path }}" \
            --preset "${{ inputs.preset }}" \
            --seed "${{ inputs.seed }}" \
            --max-physical-mb "${{ inputs.max_physical_mb }}" \
            --no-prealloc \
            --manifest-out "$RAM_OUT/ground_truth.json" \
            "${EXTRA_ARGS[@]}"

          ./scripts/disk-mgr/linux_loop.sh purge-cache "${{ matrix.mount_path }}"
          ./target/release/hw-probe \
            --root "${{ matrix.mount_path }}" \
            --out "$RAM_OUT/baseline.json"

          python ./scripts/wrappers/run_cli_scanners.py \
            --path "${{ matrix.mount_path }}" \
            --ground-truth "$RAM_OUT/ground_truth.json" \
            --out "$RAM_OUT/raw_results.json" \
            --bin-dir "./bin"

          python ./scripts/report_gen.py \
            --ground-truth "$RAM_OUT/ground_truth.json" \
            --baseline "$RAM_OUT/baseline.json" \
            --raw-results "$RAM_OUT/raw_results.json" \
            --out "$RAM_OUT/benchmark_report.md" \
            --json-out "$RAM_OUT/normalized_results.json" \
            --title-suffix "(${RAM_LABEL} | ${{ inputs.preset }} /dev/shm)"

          cat "$RAM_OUT/benchmark_report.md"

          ./scripts/disk-mgr/linux_loop.sh teardown "${{ matrix.mount_path }}" || true

      - name: Upload RAMDisk Pass Artifacts
        if: matrix.platform == 'linux' && matrix.fs == 'ext4' && inputs.enable_ramdisk == true
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.target_label }}-ramdisk-${{ inputs.preset }}
          path: results-ramdisk/
          retention-days: 30

  benchmark-ntfs:
    name: "Bench (windows-x86_64 | ${{ inputs.preset }})"
    runs-on: windows-latest
    env:
      LABEL: windows-x86_64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Cargo Registry & Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Build Core Engines (fs-mirage & hw-probe)
        shell: bash
        run: cargo build --release --workspace

      - name: Cache Pinned Scanner Binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: scanners-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wrappers/scanners_registry.json') }}

      - name: Install Pinned Target Scanners
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ./scripts/wrappers/run_cli_scanners.py --install-only --bin-dir ./bin

      - name: Resolve Virtual Disk Capacity
        shell: bash
        run: |
          VDISK_GB=$(python ./scripts/disk-mgr/vdisk_capacity.py --preset "${{ inputs.preset }}" --logical-gb "${{ inputs.logical_gb }}" --min-gb "${{ inputs.disk_size_gb }}")
          echo "VDISK_GB=$VDISK_GB" >> "$GITHUB_ENV"
          echo "Virtual disk capacity: ${VDISK_GB} GiB"

      - name: "Create & Mount Dynamic NTFS VHDX (Windows)"
        shell: pwsh
        run: ./scripts/disk-mgr/windows_vhd.ps1 create "${{ env.VDISK_GB }}" "X:/bench" ntfs

      - name: Start Disk Space Monitor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "results/$env:LABEL" | Out-Null
          Start-Process -FilePath powershell -WindowStyle Hidden -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','scripts/ci/disk_monitor.ps1','-Out',"results/$env:LABEL/disk_monitor.csv"

      - name: Materialize Deterministic Synthetic Filesystem (fs-mirage)
        shell: bash
        env:
          # aged creation timeline (scattered MFT records, directory indexes grown in pieces); same final tree
          FSM_AGING: ${{ inputs.aging && '1' || '0' }}
        run: |
          mkdir -p "results/$LABEL"
          EXTRA_ARGS=()
          if [ "${{ inputs.preset }}" = "custom" ]; then
            if [ -n "${{ inputs.files }}" ]; then
              EXTRA_ARGS+=(--files "${{ inputs.files }}")
            fi
            if [ -n "${{ inputs.logical_gb }}" ]; then
              EXTRA_ARGS+=(--logical-gb "${{ inputs.logical_gb }}")
            fi
          fi
          ./target/release/fs-mirage \
            --root "X:/bench" \
            --preset "${{ inputs.preset }}" \
            --seed "${{ inputs.seed }}" \
            --max-physical-mb "${{ inputs.max_physical_mb }}" \
            --manifest-out "results/$LABEL/ground_truth.json" \
            "${EXTRA_ARGS[@]}"

      - name: Probe On-Disk Layout (how aged the tree looks; aggregates only)
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: python ./scripts/profile/layout_probe.py "X:/bench" --json-out "results/$LABEL/layout.json" > /dev/null || true

      - name: Measure Hardware Ceiling Baseline on NTFS (hw-probe)
        shell: bash
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 purge-cache "X:/bench"
          ./target/release/hw-probe \
            --root "X:/bench" \
            --out "results/$LABEL/baseline.json"

      - name: Defender On For Scans
        if: ${{ inputs.defender_scan }}
        shell: pwsh
        run: ./scripts/disk-mgr/windows_vhd.ps1 defender-on "X:/bench"

      - name: Run All Windows Scanners on NTFS
        shell: bash
        run: |
          python ./scripts/wrappers/run_cli_scanners.py \
            --path "X:/bench" \
            --ground-truth "results/$LABEL/ground_truth.json" \
            --out "results/$LABEL/raw_results.json" \
            --bin-dir "./bin" \
            --reset-atime

      - name: Disk Space Monitor Report
        if: always()
        shell: pwsh
        run: |
          Write-Host "time, C free GB, D free GB, X free GB, VHDX GB (tail of the monitor log)"
          Get-Content "results/$env:LABEL/disk_monitor.csv" -Tail 40 -ErrorAction SilentlyContinue
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}} -AutoSize

      - name: Teardown NTFS Virtual Disk
        if: always()
        shell: bash
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 teardown "X:/bench" || true

      - name: Upload NTFS Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-windows-x86_64-${{ inputs.preset }}
          path: results/
          retention-days: 30

  # Windows on ARM (native arm64 builds of gdu, dua, dust, SpaceKnife and WinDirStat; x64-only scanners are skipped
  # rather than timed under emulation). A job of its own so the x64 NTFS+ReFS summary never waits for it.
  benchmark-ntfs-arm64:
    name: "Bench (windows-arm64 | ${{ inputs.preset }})"
    # very-high and up: sharded-windows
    if: ${{ !contains(fromJSON('["very-high","before-death"]'), inputs.preset) }}
    runs-on: windows-11-arm
    env:
      LABEL: windows-arm64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.12 (native arm64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Cache Cargo Registry & Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Build Core Engines (fs-mirage & hw-probe)
        shell: bash
        run: |
          rustc -vV | grep host
          cargo build --release --workspace

      - name: Cache Pinned Scanner Binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: scanners-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wrappers/scanners_registry.json') }}

      - name: Install Pinned Target Scanners
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import platform, sys; print('python', sys.version, platform.machine())"
          python ./scripts/wrappers/run_cli_scanners.py --install-only --bin-dir ./bin

      - name: Resolve Virtual Disk Capacity
        shell: bash
        run: |
          VDISK_GB=$(python ./scripts/disk-mgr/vdisk_capacity.py --preset "${{ inputs.preset }}" --logical-gb "${{ inputs.logical_gb }}" --min-gb "${{ inputs.disk_size_gb }}")
          echo "VDISK_GB=$VDISK_GB" >> "$GITHUB_ENV"
          echo "Virtual disk capacity: ${VDISK_GB} GiB"

      - name: "Create & Mount Dynamic NTFS VHDX (Windows)"
        shell: pwsh
        run: ./scripts/disk-mgr/windows_vhd.ps1 create "${{ env.VDISK_GB }}" "X:/bench" ntfs

      - name: Start Disk Space Monitor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "results/$env:LABEL" | Out-Null
          Start-Process -FilePath powershell -WindowStyle Hidden -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','scripts/ci/disk_monitor.ps1','-Out',"results/$env:LABEL/disk_monitor.csv"

      - name: Materialize Deterministic Synthetic Filesystem (fs-mirage)
        shell: bash
        env:
          # aged creation timeline (scattered MFT records, directory indexes grown in pieces); same final tree
          FSM_AGING: ${{ inputs.aging && '1' || '0' }}
        run: |
          mkdir -p "results/$LABEL"
          EXTRA_ARGS=()
          if [ "${{ inputs.preset }}" = "custom" ]; then
            if [ -n "${{ inputs.files }}" ]; then
              EXTRA_ARGS+=(--files "${{ inputs.files }}")
            fi
            if [ -n "${{ inputs.logical_gb }}" ]; then
              EXTRA_ARGS+=(--logical-gb "${{ inputs.logical_gb }}")
            fi
          fi
          ./target/release/fs-mirage \
            --root "X:/bench" \
            --preset "${{ inputs.preset }}" \
            --seed "${{ inputs.seed }}" \
            --max-physical-mb "${{ inputs.max_physical_mb }}" \
            --manifest-out "results/$LABEL/ground_truth.json" \
            "${EXTRA_ARGS[@]}"

      - name: Probe On-Disk Layout (how aged the tree looks; aggregates only)
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: python ./scripts/profile/layout_probe.py "X:/bench" --json-out "results/$LABEL/layout.json" > /dev/null || true

      - name: Measure Hardware Ceiling Baseline on NTFS (hw-probe)
        shell: bash
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 purge-cache "X:/bench"
          ./target/release/hw-probe \
            --root "X:/bench" \
            --out "results/$LABEL/baseline.json"

      - name: Defender On For Scans
        if: ${{ inputs.defender_scan }}
        shell: pwsh
        run: ./scripts/disk-mgr/windows_vhd.ps1 defender-on "X:/bench"

      - name: Run All Windows Scanners on NTFS
        shell: bash
        run: |
          python ./scripts/wrappers/run_cli_scanners.py \
            --path "X:/bench" \
            --ground-truth "results/$LABEL/ground_truth.json" \
            --out "results/$LABEL/raw_results.json" \
            --bin-dir "./bin" \
            --reset-atime

      - name: Disk Space Monitor Report
        if: always()
        shell: pwsh
        run: |
          Write-Host "time, C free GB, D free GB, X free GB, VHDX GB (tail of the monitor log)"
          Get-Content "results/$env:LABEL/disk_monitor.csv" -Tail 40 -ErrorAction SilentlyContinue
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}} -AutoSize

      - name: Teardown NTFS Virtual Disk
        if: always()
        shell: bash
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 teardown "X:/bench" || true

      - name: Windows ARM64 Report
        if: always()
        shell: bash
        run: |
          if [ -f "results/$LABEL/raw_results.json" ]; then
            python ./scripts/report_gen.py \
              --ground-truth "results/$LABEL/ground_truth.json" \
              --baseline "results/$LABEL/baseline.json" \
              --raw-results "results/$LABEL/raw_results.json" \
              --out "results/$LABEL/benchmark_report.md" \
              --json-out "results/$LABEL/normalized_results.json" \
              --title-suffix "(windows-arm64 NTFS | ${{ inputs.preset }}${{ inputs.defender_scan && ' · Defender on' || '' }})"
            cat "results/$LABEL/benchmark_report.md"
          fi

      - name: Upload NTFS Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-windows-arm64-${{ inputs.preset }}
          path: results/
          retention-days: 30

  # ReFS is built and scanned in two jobs: generation on ReFS grows much faster than the tree (its CPU cost per file
  # rises with the number of files on the volume: high took 2 h 41 min against 21 min on NTFS), and with the scans in
  # the same job high ran past the 6-hour job limit. The finished disk is handed over as a VHDX, so each job gets its
  # own 6 hours, and the scanning job starts on a cold, freshly attached volume.
  build-refs:
    name: "Build ReFS Volume (${{ inputs.preset }})"
    # very-high and up: sharded-windows (one build, the scans over several jobs)
    if: ${{ !contains(fromJSON('["very-high","before-death"]'), inputs.preset) }}
    runs-on: windows-latest
    timeout-minutes: 355
    env:
      LABEL: windows-x86_64-refs
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Cargo Registry & Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Build fs-mirage
        shell: bash
        run: cargo build --release -p fs-mirage

      - name: Resolve Virtual Disk Capacity
        shell: bash
        run: |
          VDISK_GB=$(python ./scripts/disk-mgr/vdisk_capacity.py --preset "${{ inputs.preset }}" --logical-gb "${{ inputs.logical_gb }}" --min-gb "${{ inputs.disk_size_gb }}")
          echo "VDISK_GB=$VDISK_GB" >> "$GITHUB_ENV"
          echo "Virtual disk capacity: ${VDISK_GB} GiB"

      - name: "Create & Mount Dynamic ReFS VHDX (Windows)"
        shell: pwsh
        run: ./scripts/disk-mgr/windows_vhd.ps1 create "${{ env.VDISK_GB }}" "X:/bench" refs

      # Preallocated like on NTFS, so both filesystems hold the same tree: with --no-prealloc the media and the
      # >=256 KiB files were sparse on ReFS only, and the NTFS-vs-ReFS cross-check compared two different trees. A plain
      # SetEndOfFile on ReFS reserves clusters without writing zeros (very-lite allocated 102 GB with a 1.5 GB VHDX).
      # 8 threads instead of fs-mirage's 32: ReFS keeps the runner's 4 cores busy, and on mid 8 threads built the tree
      # fastest (1,069 s against 1,454 s with 32, 1,458 s with 4 and 1,473 s with 16).
      - name: Materialize Deterministic Synthetic Filesystem (fs-mirage)
        shell: bash
        env:
          # aged creation timeline (scattered MFT records, directory indexes grown in pieces); same final tree
          FSM_AGING: ${{ inputs.aging && '1' || '0' }}
          FSM_THREADS: "8"
        run: |
          mkdir -p handoff
          EXTRA_ARGS=()
          if [ "${{ inputs.preset }}" = "custom" ]; then
            if [ -n "${{ inputs.files }}" ]; then
              EXTRA_ARGS+=(--files "${{ inputs.files }}")
            fi
            if [ -n "${{ inputs.logical_gb }}" ]; then
              EXTRA_ARGS+=(--logical-gb "${{ inputs.logical_gb }}")
            fi
          fi
          ./target/release/fs-mirage \
            --root "X:/bench" \
            --preset "${{ inputs.preset }}" \
            --seed "${{ inputs.seed }}" \
            --max-physical-mb "${{ inputs.max_physical_mb }}" \
            --manifest-out "handoff/ground_truth.json" \
            "${EXTRA_ARGS[@]}"
          powershell -NoProfile -Command '$p = (Get-Content (Join-Path $env:TEMP "disk_scanner_bench_X.vhdpath") -Raw).Trim(); $v = Get-Volume -DriveLetter X; "ReFS after generation: VHDX {0:N1} GB physical | X: used {1:N1} of {2:N0} GB | D: free {3:N1} GB" -f ((Get-Item $p).Length / 1GB), (($v.Size - $v.SizeRemaining) / 1GB), ($v.Size / 1GB), ((Get-PSDrive D).Free / 1GB)' || true

      - name: Detach The Volume For The Scanning Job
        shell: pwsh
        run: ./scripts/disk-mgr/windows_vhd.ps1 detach "X:/bench" "$env:GITHUB_WORKSPACE/handoff/refs.vhdx"

      - name: Upload ReFS Volume
        uses: actions/upload-artifact@v4
        with:
          name: refs-volume-${{ inputs.preset }}
          path: handoff/
          compression-level: 1
          retention-days: 1

  benchmark-refs:
    name: "Bench (windows-x86_64-refs | ${{ inputs.preset }})"
    needs: build-refs
    if: ${{ !contains(fromJSON('["very-high","before-death"]'), inputs.preset) }}
    runs-on: windows-latest
    timeout-minutes: 355
    env:
      LABEL: windows-x86_64-refs
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Cargo Registry & Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Build hw-probe & fs-mirage (the access-time audit generates its tree)
        shell: bash
        run: cargo build --release -p hw-probe -p fs-mirage

      - name: Cache Pinned Scanner Binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: scanners-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/wrappers/scanners_registry.json') }}

      - name: Install Pinned Target Scanners
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ./scripts/wrappers/run_cli_scanners.py --install-only --bin-dir ./bin

      - name: Download ReFS Volume
        uses: actions/download-artifact@v4
        with:
          name: refs-volume-${{ inputs.preset }}
          path: ${{ runner.temp }}/refs-volume

      - name: Attach The ReFS Volume
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "results/$env:LABEL" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/refs-volume/ground_truth.json" "results/$env:LABEL/ground_truth.json"
          ./scripts/disk-mgr/windows_vhd.ps1 attach "$env:RUNNER_TEMP/refs-volume/refs.vhdx" "X:/bench" refs

      - name: Probe On-Disk Layout (how aged the tree looks; aggregates only)
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: python ./scripts/profile/layout_probe.py "X:/bench" --json-out "results/$LABEL/layout.json" > /dev/null || true

      - name: Measure Hardware Ceiling Baseline on ReFS (hw-probe)
        shell: bash
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 purge-cache "X:/bench"
          ./target/release/hw-probe \
            --root "X:/bench" \
            --out "results/$LABEL/baseline.json"

      - name: Defender On For Scans
        if: ${{ inputs.defender_scan }}
        shell: pwsh
        run: ./scripts/disk-mgr/windows_vhd.ps1 defender-on "X:/bench"

      - name: Run All Windows Scanners on ReFS
        shell: bash
        run: |
          python ./scripts/wrappers/run_cli_scanners.py \
            --path "X:/bench" \
            --ground-truth "results/$LABEL/ground_truth.json" \
            --out "results/$LABEL/raw_results.json" \
            --bin-dir "./bin" \
            --reset-atime

      - name: Teardown ReFS Virtual Disk
        if: always()
        shell: bash
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/disk-mgr/windows_vhd.ps1 teardown "X:/bench" || true

      - name: Upload ReFS Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-windows-x86_64-refs-${{ inputs.preset }}
          path: results/
          retention-days: 30

  # Btrfs on Windows (WinBtrfs, experimental) lives in its own workflow: Linux builds the Btrfs disk, Windows scans it,
  # and the result is published as a supplement merged into this preset's board. Called here for the small presets
  # only; low and up are run from benchmark-winbtrfs.yml on their own, since the WinBtrfs scans take hours there.
  winbtrfs:
    name: WinBtrfs (experimental)
    if: ${{ (inputs.preset == 'very-lite' || inputs.preset == 'lite') && !inputs.defender_scan }}
    permissions:
      contents: write  # its publish job writes the supplement to main
    uses: ./.github/workflows/benchmark-winbtrfs.yml
    with:
      preset: ${{ inputs.preset }}
      seed: ${{ inputs.seed }}
      max_physical_mb: ${{ inputs.max_physical_mb }}
      aging: ${{ inputs.aging }}

  # very-high and up: the platforms whose scans outgrow a 6-hour job run them in shards (benchmark-sharded.yml). Each
  # shard also runs the anchor scanner (dua) so the shards' runners can be scaled to one another; the merged result is
  # the usual benchmark-results-<label>-<preset> artifact. Generation minutes per million items come from high.
  sharded-macos:
    name: "Sharded ${{ matrix.label }}"
    if: ${{ !inputs.windows_only && contains(fromJSON('["high","very-high","before-death"]'), inputs.preset) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-x86_64
            runner: macos-15-intel
            gen: "11.6"
            warm: "1"  # one warm scan from high up, as in the benchmark job
          - label: macos-arm64
            runner: macos-15
            gen: "5.7"
            warm: "3"
    uses: ./.github/workflows/benchmark-sharded.yml
    with:
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      platform: macos
      fs: apfs
      fs_label: APFS
      share: false  # disk images on the macOS runners crawl (see benchmark-sharded.yml): every shard generates
      gen_min_per_million: ${{ matrix.gen }}
      warm_runs: ${{ matrix.warm }}
      preset: ${{ inputs.preset }}
      disk_size_gb: ${{ inputs.disk_size_gb }}
      max_physical_mb: ${{ inputs.max_physical_mb }}
      seed: ${{ inputs.seed }}
      aging: ${{ inputs.aging }}

  sharded-windows:
    name: "Sharded ${{ matrix.label }}"
    if: ${{ contains(fromJSON('["very-high","before-death"]'), inputs.preset) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-arm64
            runner: windows-11-arm
            fs: ntfs
            fs_label: NTFS
            share: false  # its NTFS image (~70 GB at very-high) does not fit twice on the runner
            gen: "16.4"
            normalize: true
            python_arch: arm64
          - label: windows-x86_64-refs
            runner: windows-latest
            fs: refs
            fs_label: ReFS
            share: true
            gen: "0"
            normalize: false  # windows-summary writes it, after the NTFS vs ReFS audit
            python_arch: ""
    uses: ./.github/workflows/benchmark-sharded.yml
    with:
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      platform: windows
      fs: ${{ matrix.fs }}
      fs_label: ${{ matrix.fs_label }}
      share: ${{ matrix.share }}
      gen_min_per_million: ${{ matrix.gen }}
      normalize: ${{ matrix.normalize }}
      python_arch: ${{ matrix.python_arch }}
      preset: ${{ inputs.preset }}
      disk_size_gb: ${{ inputs.disk_size_gb }}
      max_physical_mb: ${{ inputs.max_physical_mb }}
      seed: ${{ inputs.seed }}
      aging: ${{ inputs.aging }}
      defender_scan: ${{ inputs.defender_scan }}

  windows-summary:
    name: "Windows NTFS+ReFS Summary (${{ inputs.preset }})"
    needs: [benchmark-ntfs, benchmark-refs, sharded-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download NTFS & ReFS Windows Results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-windows-x86_64*-${{ inputs.preset }}
          path: results/
          merge-multiple: true

      - name: NTFS vs ReFS Cross-Filesystem Audit & Windows Report
        shell: bash
        run: |
          N="results/windows-x86_64"
          R="results/windows-x86_64-refs"
          if [ ! -f "$N/raw_results.json" ]; then
            echo "::error::NTFS raw_results.json missing; cannot build Windows report"
            exit 1
          fi
          if [ -f "$R/raw_results.json" ]; then
            python ./scripts/refs_audit.py \
              --ntfs-results "$N/raw_results.json" \
              --refs-results "$R/raw_results.json" \
              --md-out "$N/refs_audit.md"
          else
            echo "> [!WARNING]
          > ReFS run produced no results; NTFS vs ReFS cross-check skipped." > "$N/refs_audit.md"
          fi

          python ./scripts/report_gen.py \
            --ground-truth "$N/ground_truth.json" \
            --baseline "$N/baseline.json" \
            --raw-results "$N/raw_results.json" \
            --out "$N/benchmark_report.md" \
            --json-out "$N/normalized_results.json" \
            --title-suffix "(windows-x86_64 | ${{ inputs.preset }}${{ inputs.defender_scan && ' · Defender on' || '' }})" \
            --cross-fs-checked

          if [ -f "$R/raw_results.json" ]; then
            python ./scripts/report_gen.py \
              --ground-truth "$R/ground_truth.json" \
              --baseline "$R/baseline.json" \
              --raw-results "$R/raw_results.json" \
              --out "$R/benchmark_report.md" \
              --json-out "$R/normalized_results.json" \
              --title-suffix "(windows-x86_64 ReFS | ${{ inputs.preset }}${{ inputs.defender_scan && ' · Defender on' || '' }})" \
              --cross-fs-checked
          fi

          cat "$N/benchmark_report.md"
          echo ""
          if [ -f "$R/benchmark_report.md" ]; then
            cat "$R/benchmark_report.md"
            echo ""
          fi
          cat "$N/refs_audit.md"

      - name: Upload Final Windows Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-windows-final-${{ inputs.preset }}
          path: results/
          retention-days: 30

  # GitHub lists job summaries in the order the jobs finish, so the overall leaderboard can only sit at the top if
  # one last job writes the whole summary: the leaderboard first, then every platform's full report below it.
  # The platform jobs print their own report into their job log instead.
  leaderboard:
    name: "Overall Leaderboard (${{ inputs.preset }})"
    # WinBtrfs is not waited for: it publishes its own supplement (see the winbtrfs job)
    needs: [benchmark, benchmark-ntfs-arm64, windows-summary, sharded-macos, sharded-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # publishes the README leaderboard and badge files to main
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download All Platform Results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-*-${{ inputs.preset }}
          path: artifacts/

      - name: Build Leaderboard & Write Run Summary
        shell: bash
        run: |
          mkdir -p lb-out
          python ./scripts/leaderboard.py \
            --artifacts artifacts \
            --preset "${{ inputs.preset }}${{ inputs.defender_scan && ' · Defender on' || '' }}" \
            --sha "${{ github.sha }}" \
            --out lb-out/leaderboard.md \
            --json-out lb-out/leaderboard.json \
            --summary-out lb-out/summary.md
          cat lb-out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Leaderboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-leaderboard-${{ inputs.preset }}
          path: lb-out/
          retention-days: 30

      # Only plain runs of a standard preset on main reach the README; experiments (Defender on, fresh timeline,
      # custom sizes) and runs with failed platforms stay in their own run summary.
      - name: Publish Leaderboard To README
        if: >-
          github.ref == 'refs/heads/main' && inputs.preset != 'custom' &&
          !inputs.defender_scan && inputs.aging
        shell: bash
        run: bash ./scripts/ci/publish_board.sh lb-out/leaderboard.json standard "${{ inputs.preset }}"
