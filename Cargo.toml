[workspace]
resolver = "2"
members = [
    "crates/fs-mirage",
    "crates/hw-probe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["disk-scanner-bench contributors"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
